name: Update Rules

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build clash-skk
        run: |
          mkdir -p bin
          go build -o bin/clash-skk ./cmd/clash-skk

      - name: Install Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')"
          asset="mihomo-linux-amd64-compatible-${tag}.gz"
          url="$(gh api "repos/MetaCubeX/mihomo/releases/tags/${tag}" --jq ".assets[] | select(.name == \"${asset}\") | .browser_download_url")"
          test -n "$url"
          curl --fail --location --retry 3 --output /tmp/mihomo.gz "$url"
          gzip --decompress --stdout /tmp/mihomo.gz > bin/mihomo
          chmod +x bin/mihomo
          bin/mihomo -v

      # srs is compiled with the reF1nd fork (latest stable, not prerelease) so the
      # binary format always matches what the router consumes.
      - name: Install sing-box (reF1nd)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/reF1nd/sing-box-releases/releases --jq '[.[] | select(.prerelease == false)][0].tag_name')"
          ver="${tag#v}"
          asset="sing-box-${ver}-linux-amd64-musl.tar.gz"
          curl --fail --location --retry 3 --output /tmp/sing-box.tgz \
            "https://github.com/reF1nd/sing-box-releases/releases/download/${tag}/${asset}"
          tar -xzf /tmp/sing-box.tgz -C /tmp
          install -m 755 "/tmp/sing-box-${ver}-linux-amd64-musl/sing-box" bin/sing-box
          bin/sing-box version

      - name: Update YAML and MRS rules
        env:
          MIHOMO_BIN: ./bin/mihomo
        run: |
          ./scripts/update-rules.sh
          ./scripts/update-blackmatrix7-rules.py

      - name: Update sing-box source and srs rules
        env:
          SING_BOX_BIN: ./bin/sing-box
        run: |
          ./scripts/update-singbox-rules.py
          ./scripts/verify-singbox-srs.py

      - name: Commit changes
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md scripts .github Clash MRS SingBox
            git commit -m "chore: update YAML, MRS and SRS rules"
            git push
          else
            echo "No changes to commit"
          fi
