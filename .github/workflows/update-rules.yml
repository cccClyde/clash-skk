name: Update Rules

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build clash-skk
        run: |
          mkdir -p bin
          go build -o bin/clash-skk ./cmd/clash-skk

      - name: Install Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')"
          asset="mihomo-linux-amd64-compatible-${tag}.gz"
          url="$(gh api "repos/MetaCubeX/mihomo/releases/tags/${tag}" --jq ".assets[] | select(.name == \\\"${asset}\\\") | .browser_download_url")"
          test -n "$url"
          curl --fail --location --retry 3 --output /tmp/mihomo.gz "$url"
          gzip --decompress --stdout /tmp/mihomo.gz > bin/mihomo
          chmod +x bin/mihomo
          bin/mihomo -v

      - name: Update YAML and MRS rules
        env:
          MIHOMO_BIN: ./bin/mihomo
        run: ./scripts/update-rules.sh

      - name: Commit changes
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md scripts .github Clash MRS
            git commit -m "chore: update YAML and MRS rules"
            git push
          else
            echo "No changes to commit"
          fi
